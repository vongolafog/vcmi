trigger: none
pr: none

pool:
  vmImage: windows-2022

steps:

# 1. Checkout
- checkout: self
  clean: true
  submodules: recursive
  fetchDepth: 1


# 2. Install tools
- powershell: |

    git --version
    python --version

    python -m pip install --upgrade pip
    python -m pip install pipx

    pipx install conan

    conan --version

  displayName: Install Conan


# 3. Restore official VCMI Conan dependencies
- powershell: |

    bash CI/install_conan_dependencies.sh dependencies-windows-x64

    if ($LASTEXITCODE -ne 0) {
        throw "Conan dependency restore failed"
    }

  displayName: Restore VCMI dependencies



# 4. Conan install (official parameters)
- powershell: |

    conan profile detect

    conan install . `
      --output-folder=conan-generated `
      --build=never `
      --profile=dependencies/conan_profiles/msvc-x64 `
      --conf="tools.cmake.cmaketoolchain:generator=Ninja" `
      --conf="tools.microsoft.msbuild:vs_version=17" `
      -s "&:build_type=RelWithDebInfo" `
      -o "&:target_pre_windows10=True"

    if ($LASTEXITCODE -ne 0) {
        throw "Conan install failed"
    }

  displayName: Conan configure

# Cache ccache
- task: Cache@2
  inputs:
    key: '"ccache" | "$(Agent.OS)" | "nullkiller2-v0.12"'
    path: $(USERPROFILE)\.ccache
  displayName: Cache compiler
- powershell: |
    ccache -s
    ccache -p
  displayName: Check ccache

# 5. List CMake targets
- powershell: |

    $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

    $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()

    if (-not $vsPath) {
        throw "Visual Studio not found"
    }


    cmd.exe /c "`"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 && cmake --preset windows-msvc-ninja-release"

    if ($LASTEXITCODE -ne 0) {
        throw "CMake configure failed"
    }


    cmd.exe /c "`"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 && cmake --build --preset windows-msvc-ninja-release --target help"

    if ($LASTEXITCODE -ne 0) {
        throw "List target failed"
    }

  displayName: List CMake targets



name: Nullkiller2 Windows full package

on:
  push:
    branches:
      - nullkiller2-v0.12-alpha1
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure MSVC v142 toolset
        shell: powershell
        run: |
          $toolset = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "14.29*" } |
            Select-Object -First 1

          if (-not $toolset) {
            $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (-not (Test-Path $installer)) { throw "Visual Studio Installer not found." }

            $args = @(
              "modify",
              "--installPath", "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
              "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64",
              "--quiet",
              "--norestart"
            )

            $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              throw "Visual Studio Installer exited with code $($p.ExitCode)"
            }
          }

      - name: Setup MSVC 14.29
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29

      - name: Install Conan 2
        shell: cmd
        run: |
          python -m pip install --upgrade "conan>=2,<3"
          conan profile detect --force
          conan --version

      - name: Restore VCMI dependencies
        shell: bash
        run: |
          bash CI/install_conan_dependencies.sh dependencies-windows-x64

      - name: Generate Conan toolchain
        shell: cmd
        run: |
          conan install . --output-folder=conan-msvc --build=never --profile=dependencies\conan_profiles\msvc-x64 -s "&:build_type=RelWithDebInfo" -c tools.cmake.cmaketoolchain:generator=Ninja -c tools.microsoft.msbuild:vs_version=17 -o "&:target_pre_windows10=True"

      - name: Configure full Windows build
        shell: cmd
        run: |
          call conan-msvc\conanrun.bat
          cmake -S . -B build -G Ninja ^
            -DCMAKE_TOOLCHAIN_FILE="%CD%\conan-msvc\conan_toolchain.cmake" ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DENABLE_CCACHE=OFF ^
            -DENABLE_TEST=OFF ^
            -DENABLE_PCH=OFF ^
            -DPACKAGE_FILE_NAME=Nullkiller2-v0.12-alpha1-Windows-x64

      - name: Build complete VCMI runtime
        shell: cmd
        run: |
          call conan-msvc\conanrun.bat
          cmake --build build --parallel 2

      - name: Create complete Windows ZIP
        shell: cmd
        run: |
          call conan-msvc\conanrun.bat
          cd build
          cpack -C RelWithDebInfo
          if errorlevel 1 exit /b 1

      - name: Verify package
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path build -Filter "Nullkiller2-v0.12-alpha1-Windows-x64*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Complete Windows ZIP was not generated." }

          Write-Host "Generated package:"
          Get-Item $zip.FullName | Format-List FullName,Length,LastWriteTime

          New-Item -ItemType Directory -Force -Path package-check | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath package-check -Force

          $required = @("VCMI_client.exe", "VCMI_lib.dll")
          foreach ($name in $required) {
            $found = Get-ChildItem -Path package-check -Filter $name -Recurse | Select-Object -First 1
            if (-not $found) { throw "$name is missing from the package." }
            Write-Host "Found $name at $($found.FullName)"
          }

      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Nullkiller2-v0.12-alpha1-Windows-Full
          path: build/Nullkiller2-v0.12-alpha1-Windows-x64*.zip
          if-no-files-found: error
